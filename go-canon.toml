# bellwether local deltas over go-canon's built-in presets.
# Everything below is optional; delete what you do not tune.
# Schema is documented in the go-canon README.

[test]
# main() cannot run under `go test` — importing the package starts a
# listener — and Go's coverage has no per-file exclusion, so the gate
# lands here as 99%: everything except the composition root in main()
# is exercised.
coverage-threshold = 99.0

# [golangci]
# Deep-merged over go-canon's embedded golangci-lint preset:
# maps merge recursively, lists and scalars replace, e.g.
#
#   [golangci.linters.settings.dupl]
#   threshold = 200

# [dupl]
# tokens = 150

# [markdown]
# exclude = ["docs/legacy/*.md"]
