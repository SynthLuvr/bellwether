name: CI

on:
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~\AppData\Local\go-build
          key: ${{ runner.os }}-gocache-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-gocache-

      - name: Install pandoc on Linux (pinned for Markdown lint/format)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i pandoc-3.11-1-amd64.deb
          pandoc --version | head -1

      - name: Install pandoc on Windows (pinned for Markdown lint/format)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\pandoc.zip"
          $dir = "$env:RUNNER_TEMP\pandoc-3.11"
          Invoke-WebRequest -Uri https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP"
          Add-Content $env:GITHUB_PATH $dir
          & "$dir\pandoc.exe" --version | Select-Object -First 1

      - name: Warm the module cache
        run: go mod download

      # First `go tool` invocation compiles task, go-canon, golangci-lint,
      # govulncheck, and modernize from the pinned tool block; the GOCACHE
      # action above keeps those builds across runs.
      - name: Lint
        run: go tool task lint

      - name: Test
        run: go tool task test
